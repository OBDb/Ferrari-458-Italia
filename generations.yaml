generations:
  - name: "First Generation"
    start_year: 2009
    end_year: 2010
    description: "The Ferrari 458 Italia (Type F142) was introduced at the 2009 Frankfurt Motor Show as the successor to the F430. Designed by Pininfarina under the direction of Donato Coco, the Ferrari Styling Centre director during 2009, it featured flowing, aerodynamic styling with innovative aeroelastic winglets in the front grille that deformed at high speeds to reduce drag. Powered by a naturally aspirated 4.5L Ferrari F136 V8 engine producing 570 PS (562 HP) at 9,000 rpm, it was paired with a seven-speed dual-clutch transmission—Ferrari's first in a mid-engine production car. The car featured direct fuel injection and delivered exceptional performance with 0-100 km/h acceleration in 3.4 seconds and a top speed over 325 km/h. The cockpit introduced a new driver-focused layout with major controls mounted on the steering wheel, drawing input from former Ferrari Formula 1 driver Michael Schumacher. The car produced 140 kg of downforce at 200 km/h and featured advanced suspension with double wishbones and multi-link setup, E-Diff electronic differential, and F1-Trac traction control."

  - name: "First Generation (2011 Spider)"
    start_year: 2011
    end_year: 2015
    description: "The 458 Spider was introduced at the 2011 Frankfurt Motor Show as a convertible variant of the 458 Italia, featuring an innovative aluminium retractable hardtop that weighs 25 kg less than a soft roof and requires 14 seconds for operation. The Spider shared the same 4.5L V8 engine with 570 PS output, seven-speed dual-clutch transmission, and chassis as the coupe but with a redesigned engine cover to accommodate the retractable roof system. The Spider achieved the same 0-100 km/h acceleration time as the coupe (3.4 seconds) but with a slightly lower top speed of 200 mph. The Spider variant remained in production alongside the base model and Speciale variants until the end of the generation in 2015."

  - name: "First Generation (2013 Speciale)"
    start_year: 2013
    end_year: 2015
    description: "The 458 Speciale was unveiled in 2013 at the Frankfurt Motor Show as the high-performance variant of the 458 Italia. Featuring enhanced aerodynamics designed by Ferrari Styling Centre in cooperation with Pininfarina, it included forged wheels, a vented bonnet, finned side sills, a taller rear spoiler, and redesigned bumpers with active aerodynamic flaps designed to balance downforce and cut drag at speed. The engine was revised with power increased to 605 PS (597 HP) at 9,000 rpm with the same 540 Nm torque at 6,000 rpm as the standard 458. Electronic systems were updated and a new Side Slip Angle Control (SSC) system was introduced to improve car control on the limit, providing instant-to-instant analysis of the car's side-slip and optimizing torque management. The Speciale accelerated from 0-100 km/h in 3.0 seconds and achieved a Fiorano test track lap time of 1:23.5 with lateral acceleration reaching 1.33 g. Only 1,309 Speciales were made during its production run."

  - name: "First Generation (2014 Speciale A)"
    start_year: 2014
    end_year: 2015
    description: "The 458 Speciale A (Aperta, meaning 'open' in Italian) was unveiled at the 2014 Paris Motor Show as the convertible variant of the 458 Speciale. Limited to only 499 examples (49 right-hand drive), the Speciale A combined the Speciale's 605 PS naturally aspirated V8 engine and advanced active aerodynamics with a convertible body style. The car featured the same performance characteristics as the Speciale coupe, achieving 0-100 km/h acceleration in 3.0 seconds and a top speed of 320 km/h. At the time of its release, it was the most powerful street-legal naturally aspirated Ferrari convertible ever launched, until surpassed by the LaFerrari Aperta in 2017. The Speciale A represented the pinnacle of the 458 platform, combining track-focused performance enhancements with the open-air driving experience."
